<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#081925">
  <title>页面未找到 · 青境智衡</title>
  <link rel="canonical" href="https://runner-cpu.github.io/QJZH/">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #e8f0f8;
      background:
        radial-gradient(circle at 18% 0%, rgba(0, 212, 170, .2), transparent 34rem),
        radial-gradient(circle at 90% 100%, rgba(74, 158, 255, .18), transparent 32rem),
        #081925;
    }
    main {
      width: min(720px, 100%);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid rgba(148, 181, 204, .32);
      border-radius: 16px;
      background: rgba(14, 39, 55, .9);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .34);
    }
    .eyebrow { margin: 0 0 18px; color: #00d4aa; font: 800 .78rem/1.2 ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.15rem, 8vw, 4.8rem); line-height: .98; letter-spacing: -.045em; }
    p { max-width: 52ch; margin: 24px 0 0; color: #a7bed0; font-size: 1rem; line-height: 1.75; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }
    a { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border: 1px solid rgba(148, 181, 204, .4); border-radius: 7px; color: #e8f0f8; font-weight: 750; text-decoration: none; }
    a:first-child { border-color: #00d4aa; color: #06131f; background: #00d4aa; }
    a:focus-visible { outline: 3px solid #ffd93d; outline-offset: 3px; }
    .route { margin-top: 36px; padding-top: 18px; border-top: 1px solid rgba(148, 181, 204, .2); color: #7897ac; font: .78rem/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">QJZH / 404</p>
    <h1>这里没有数据记录</h1>
    <p>当前地址不在青境智衡的六个演示视图中。返回环境总览，或直接进入数据接入页继续体验高原圈舍环境数据服务。</p>
    <nav aria-label="返回青境智衡">
      <a href="/QJZH/#/overview">返回环境总览</a>
      <a href="/QJZH/#/data">进入数据接入</a>
    </nav>
    <div class="route" id="requestedPath">HTTP 404 · PAGE NOT FOUND</div>
  </main>
  <script>document.getElementById("requestedPath").textContent = "HTTP 404 · " + location.pathname;</script>
</body>
</html>
