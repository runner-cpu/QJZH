name: Verify and deploy GitHub Pages

on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Run browser-surface regression tests
        run: node --test tests/*.test.js

      - name: Verify locked compensation model
        run: node verify_compensator.js

      - name: Verify copyright and originality manifest
        run: node scripts/verify-originality.js

      - name: Verify generated knowledge-base document
        run: |
          node generate-knowledge-base-document.js
          git diff --exit-code -- knowledge-base-rules.md

      - name: Verify source deployment surface
        run: node verify-deployment.js .

      - name: Parse every JavaScript file
        shell: bash
        run: find . -type f -name '*.js' -not -path './.git/*' -not -path './dist/*' -not -path './node_modules/*' -not -path './output/*' -print0 | xargs -0 -n1 node --check

      - name: Build allowlisted Pages artifact
        run: node scripts/build-pages.js --out dist

      - name: Verify built Pages artifact
        run: node verify-deployment.js dist

      - name: Install locked browser-check dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Verify browser workflows, layouts and accessibility
        run: node scripts/browser-check.mjs --root dist

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qjzh-browser-evidence-${{ github.sha }}
          path: output/browser-audit
          if-no-files-found: ignore

      - name: Verify public text and artifact boundaries
        run: |
          test ! -e dist/tests
          test ! -e dist/docs/superpowers
          test ! -e dist/output
          test ! -e dist/backups
          test -e dist/COPYRIGHT.md
          test -e dist/ORIGINALITY.md

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

      - name: Upload artifact attestation manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qjzh-pages-manifest-${{ github.sha }}
          path: dist/artifact-manifest.json
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out smoke-test scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use Node.js 24 for post-deploy checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Smoke-test deployed Pages and commit
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/smoke-pages.js --base "$PAGES_URL" --retries 4 --expected-commit "${{ github.sha }}"
