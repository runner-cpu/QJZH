name: Verify compensation lock

on:
  push:
    branches: [gh-pages, main]
  pull_request:
    branches: [gh-pages, main]

jobs:
  verify-compensator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node verify_compensator.js
      - run: node generate-knowledge-base-document.js
      - run: git diff --exit-code -- knowledge-base-rules.md
      - run: node verify-deployment.js .
