<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="qjzh-release-version" content="20261007">
  <meta name="qjzh-model-version" content="1.0.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#081925">
  <title>青境智衡 · 部署自检</title>
  <link rel="canonical" href="https://runner-cpu.github.io/QJZH/online_test.html">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307141f'/%3E%3Cpath d='M16 38h32M22 28h20M32 14v34' stroke='%2316d6b0' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <script defer src="model_weights.js?v=1.0.0"></script>
  <script defer src="compensator_engine.js?v=1.0.0"></script>
  <!-- Release assets use qjzh-release-version; model assets use qjzh-model-version. Keep both pages in sync. -->
  <script defer src="build_info.js?v=20261007"></script>
  <script defer src="ui_text_map.js?v=20261007"></script>
  <script defer src="errorHandler.js?v=20261007"></script>
  <script defer src="csvTemplate.js?v=20261007"></script>
  <script defer src="dataImport.js?v=20261007"></script>
  <script defer src="riskPolicy.js?v=20261007"></script>
  <script defer src="reportRenderer.js?v=20261007"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Noto Sans SC", "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --page-bg: #081925;
      --surface: #10293a;
      --surface-quiet: #0d2231;
      --surface-raised: #132f42;
      --line: rgba(148, 181, 204, .22);
      --line-strong: rgba(148, 181, 204, .34);
      --text: #e8f0f8;
      --muted: #8ea8ba;
      --muted-strong: #b7cad7;
      --accent: #16d6b0;
      --accent-soft: rgba(22, 214, 176, .14);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 20px 64px; color: var(--text); background: radial-gradient(circle at 15% 0%, rgba(0,212,170,.14), transparent 34rem), linear-gradient(145deg, #081925 0%, #091d2a 58%, #071620 100%); }
    main { width: min(960px, 100%); margin: 0 auto; }
    header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: start; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font: 800 .72rem/1.2 ui-monospace, monospace; letter-spacing: .14em; }
    h1 { margin: 0; max-width: 14ch; font-size: clamp(2rem, 5vw, 3.5rem); line-height: .98; letter-spacing: -.045em; text-wrap: balance; }
    .summary { min-width: 156px; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: rgba(16,42,59,.82); box-shadow: 0 14px 34px rgba(3,14,22,.18); text-align: right; }
    .summary strong { display: block; color: var(--accent); font: 900 1.7rem/1 ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .summary span { display: block; margin-top: 6px; color: var(--muted); font-size: .76rem; }
    .metadata { display: grid; gap: 14px; margin-bottom: 20px; }
    .metadata-group { display: grid; gap: 0; overflow: hidden; border: 1px solid var(--line-strong); border-radius: var(--radius); background: rgba(148,181,204,.12); box-shadow: 0 12px 30px rgba(3,14,22,.14); }
    .metadata-group.runtime { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .metadata-group.identity { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .metadata-heading { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 18px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, rgba(19,47,66,.96), rgba(13,34,49,.94)); }
    .metadata-heading strong { color: var(--text); font-size: .94rem; font-weight: 800; letter-spacing: .01em; }
    .metadata-heading span { color: var(--muted); font-size: .76rem; text-align: right; }
    .metadata-field { min-width: 0; padding: 14px 16px 15px; background: var(--surface); }
    .metadata-group.runtime .metadata-field + .metadata-field { border-left: 1px solid var(--line); }
    .metadata-field > span { display: block; margin-bottom: 7px; color: var(--muted); font-size: .72rem; }
    .metadata-field code { display: block; color: var(--text); overflow-wrap: anywhere; font-size: .9rem; line-height: 1.35; font-variant-numeric: tabular-nums; }
    .metadata-field small { display: block; margin-top: 7px; color: #7897ac; font-size: .7rem; line-height: 1.35; }
    .metadata-band { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(150px, .8fr) repeat(2, minmax(0, 1fr)); }
    .metadata-band + .metadata-band { border-top: 1px solid var(--line); }
    .metadata-band-heading { display: flex; flex-direction: column; justify-content: center; gap: 5px; min-width: 0; padding: 13px 16px; border-right: 1px solid var(--line); background: rgba(13,34,49,.82); }
    .metadata-band-heading strong { color: var(--muted-strong); font-size: .8rem; font-weight: 800; }
    .metadata-band-heading span { color: #7897ac; font-size: .7rem; line-height: 1.35; }
    .metadata-band .metadata-field + .metadata-field { border-left: 1px solid var(--line); }
    .metadata .release { box-shadow: inset 3px 0 0 var(--accent); }
    .metadata .deployment { box-shadow: inset 3px 0 0 rgba(140,190,211,.56); }
    .metadata .model, .metadata .rules { box-shadow: inset 3px 0 0 rgba(140,190,211,.3); }
    .metadata-fingerprint { display: grid; gap: 10px; min-width: 0; padding: 14px 16px 15px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: linear-gradient(135deg, rgba(13,34,49,.9), rgba(16,42,59,.7)); box-shadow: 0 12px 30px rgba(3,14,22,.12); }
    .metadata-fingerprint-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; }
    .metadata-fingerprint-heading strong { color: var(--muted-strong); font-size: .82rem; font-weight: 800; }
    .metadata-fingerprint-heading span { color: var(--muted); font-size: .72rem; text-align: right; }
    .metadata-fingerprint code { display: block; padding: 10px 12px; border: 1px solid rgba(148,181,204,.2); border-radius: 8px; background: rgba(8,25,37,.74); color: #cde0eb; overflow-wrap: anywhere; line-height: 1.45; }
    ol { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    li { position: relative; padding: 13px 16px 13px 46px; border: 1px solid rgba(148,181,204,.2); border-radius: 8px; background: rgba(16,41,58,.86); line-height: 1.5; }
    li::before { position: absolute; left: 15px; top: 14px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; font: 900 .7rem/1 ui-monospace, monospace; content: "…"; }
    li.pass { border-color: rgba(0,212,170,.38); }
    li.pass::before { color: #041c17; background: #00d4aa; content: "✓"; }
    li.fail { border-color: rgba(255,77,94,.55); background: rgba(92,27,40,.5); }
    li.fail::before { color: #fff; background: #ff4d5e; content: "!"; }
    footer { margin-top: 22px; color: #7897ac; font-size: .82rem; }
    footer a { color: #8cebd8; border-radius: 4px; }
    footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 820px) { .metadata-group.runtime { grid-template-columns: repeat(3, minmax(0, 1fr)); } .metadata-group.identity { grid-template-columns: repeat(2, minmax(0, 1fr)); } .metadata-band { grid-template-columns: minmax(126px, .75fr) repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) {
      body { padding: 24px 14px 48px; }
      header { grid-template-columns: 1fr; align-items: start; }
      .summary { text-align: left; }
      .metadata-heading, .metadata-fingerprint-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
      .metadata-heading span, .metadata-fingerprint-heading span { text-align: left; }
      .metadata-group.runtime, .metadata-group.identity { grid-template-columns: 1fr; }
      .metadata-group.runtime .metadata-field + .metadata-field, .metadata-band .metadata-field + .metadata-field { border-left: 0; border-top: 1px solid var(--line); }
      .metadata-band { grid-template-columns: 1fr; }
      .metadata-band-heading { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">部署诊断</p><h1>青境智衡部署自检</h1></div>
      <div class="summary" aria-live="polite"><strong id="summaryCount">0 / 0</strong><span id="summaryLabel">正在检查公开产物</span></div>
    </header>
    <section class="metadata" aria-label="构建信息">
      <div class="metadata-group runtime" role="group" aria-labelledby="metadata-runtime-title">
        <div class="metadata-heading" id="metadata-runtime-title"><strong>构建来源</strong><span>确认页面来自哪个运行环境和提交</span></div>
        <div class="metadata-field"><span>运行环境</span><code id="environment">--</code><small>production / local</small></div>
        <div class="metadata-field"><span>提交 SHA</span><code id="commit">--</code><small>发布后不可变的源提交</small></div>
        <div class="metadata-field"><span>构建时间</span><code id="builtAt">--</code><small>UTC 构建时间</small></div>
      </div>
      <div class="metadata-group identity" role="group" aria-labelledby="metadata-identity-title">
        <div class="metadata-heading" id="metadata-identity-title"><strong>版本身份</strong><span>不同字段回答不同的复核问题，不应合并成一个版本号</span></div>
        <div class="metadata-band release-band">
          <div class="metadata-band-heading"><strong>发布与部署</strong><span>页面资源与本次构建</span></div>
          <div class="metadata-field release" data-version-role="release"><span>发布版本</span><code id="releaseVersion">--</code><small>静态资源缓存键</small></div>
          <div class="metadata-field deployment" data-version-role="deployment"><span>部署版本</span><code id="version">--</code><small>一次 CI 构建实例</small></div>
        </div>
        <div class="metadata-band contract-band">
          <div class="metadata-band-heading"><strong>执行契约</strong><span>算法与规则的可复现身份</span></div>
          <div class="metadata-field model" data-version-role="model"><span>模型版本</span><code id="modelVersion">--</code><small>锁定权重接口</small></div>
          <div class="metadata-field rules" data-version-role="rules"><span>规则版本</span><code id="rulesVersion">--</code><small>知识库规则集</small></div>
        </div>
      </div>
      <div class="metadata-fingerprint" role="group" aria-labelledby="metadata-fingerprint-title">
        <div class="metadata-fingerprint-heading"><strong id="metadata-fingerprint-title">规则完整性指纹</strong><span>内容证据，不是另一种版本号</span></div>
        <code id="rulesFingerprint">--</code>
      </div>
    </section>
    <ol id="results"></ol>
    <footer>此页只检查公开静态产物和浏览器运行接口。<a href="./#/overview">返回环境总览</a></footer>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var passedCount = 0;
      var totalCount = 0;
      var summaryCount = document.getElementById("summaryCount");
      var summaryLabel = document.getElementById("summaryLabel");

      function updateSummary() {
        summaryCount.textContent = passedCount + " / " + totalCount;
        summaryLabel.textContent = passedCount === totalCount ? "全部检查通过" : "发现 " + (totalCount - passedCount) + " 项异常";
      }

      function report(passed, message) {
        totalCount += 1;
        if (passed) passedCount += 1;
        var item = document.createElement("li");
        item.className = passed ? "pass" : "fail";
        item.textContent = message;
        document.getElementById("results").appendChild(item);
        updateSummary();
      }

      var build = window.BUILD_INFO || { releaseVersion: "20261007", deploymentVersion: "dev", modelVersion: "1.0.0", rulesVersion: "knowledgeBase.js@1.0.0", rulesFingerprint: "sha256:f08ef4a6d02ae435fa8bef03403e85d947d07553cde752f7904734460eaff111", version: "dev", commit: "local", builtAt: null, environment: "local" };
      document.getElementById("environment").textContent = build.environment || "unknown";
      document.getElementById("commit").textContent = build.commit || build.version || "unknown";
      document.getElementById("releaseVersion").textContent = build.releaseVersion || "unknown";
      document.getElementById("version").textContent = build.deploymentVersion || build.version || "unknown";
      document.getElementById("modelVersion").textContent = window.MODEL_WEIGHTS?.version || build.modelVersion || "unknown";
      document.getElementById("rulesVersion").textContent = build.rulesVersion || "unknown";
      document.getElementById("rulesFingerprint").textContent = build.rulesFingerprint || "unknown";
      document.getElementById("builtAt").textContent = build.builtAt || "本地开发构建";
      report(Boolean(build.releaseVersion && (build.deploymentVersion || build.version) && build.modelVersion && build.rulesVersion && build.commit && build.environment), "发布、部署、模型、规则与提交字段已加载");
      report(/^sha256:[0-9a-f]{64}$/i.test(build.rulesFingerprint || ""), "规则 SHA-256 指纹格式有效");
      report(build.environment !== "production" || Boolean(build.builtAt), "生产构建包含不可变 UTC 构建时间");

      var hasWeights = typeof window.MODEL_WEIGHTS !== "undefined";
      report(hasWeights && Boolean(window.MODEL_WEIGHTS.version), "锁定模型参数与版本已加载");
      try {
        var result = window.compensate(2800, 10, 60, 30);
        report(Number.isFinite(result) && result >= 15 && result <= 25, "高原校准接口可执行：" + result.toFixed(2) + " ppm");
      } catch (error) {
        report(false, "高原校准接口执行失败：" + error.message);
      }
      report(Boolean(window.QJZH && window.QJZH.dataImport), "数据接入模块已加载");
      report(Boolean(window.QJZH && window.QJZH.riskPolicy), "统一风险策略模块已加载");
      report(Boolean(window.QJZH && window.QJZH.reportRenderer), "环境报告渲染器已加载");
      report(typeof window.QJZH?.dataImport?.nextRecord === "function" && typeof window.QJZH?.dataImport?.useImported === "function", "导入数据回放接口可用");

      try {
        var sampleReport = { language: "zh", startDate: "2026-09-01", endDate: "2026-09-27", noRecords: false, complianceRate: 0.5, averageNh3: 12, maxNh3: 20, temperatureRange: { min: -5, max: 10 }, adviceCount: 2, riskDistribution: { "正常": 1, "关注": 1, "待办": 0, "紧急": 0 }, trendSeries: [{ timestamp: "2026-09-27T08:00:00+08:00", value: 12 }], generatedAt: "2026-09-27", source: "QJZH 本地记录" };
        var reportHtml = window.QJZH.reportRenderer.buildHtml(sampleReport);
        var institutionHtml = window.QJZH.reportRenderer.buildHtml(Object.assign({}, sampleReport, { seriesMode: "institution", trendSeries: [{ label: "海东示范圈舍", value: 8.4 }] }));
        report(reportHtml.indexOf("data-chart='nh3-trend'") >= 0, "报告包含氨气趋势图");
        report(institutionHtml.indexOf("data-chart='nh3-comparison'") >= 0, "机构报告包含圈舍对比图");
        report(reportHtml.indexOf("data-chart='risk-distribution'") >= 0, "报告包含风险分布图");
        report(reportHtml.indexOf("print-color-adjust:exact") >= 0, "报告启用打印颜色保真");
      } catch (error) {
        report(false, "报告渲染器执行失败：" + error.message);
      }

      Promise.all([
        fetch("index.html", { cache: "no-store" }).then(function (response) { if (!response.ok) throw new Error("index.html HTTP " + response.status); return response.text(); }),
        fetch("dashboard.js", { cache: "no-store" }).then(function (response) { if (!response.ok) throw new Error("dashboard.js HTTP " + response.status); return response.text(); })
      ]).then(function (sources) {
        var html = sources[0];
        var dashboard = sources[1];
        report((html.match(/<main\b/g) || []).length === 1 && html.indexOf('href="#main-content"') >= 0, "主页面包含唯一 main 与跳转主内容链接");
        report((html.match(/<button class="pipeline-step/g) || []).length === 3 && html.indexOf('id="pipelineNext"') >= 0, "流程步骤与下一步操作均使用原生按钮");
        report(html.indexOf('src="dashboard.js?v=') >= 0 && html.indexOf('src="riskPolicy.js?v=') >= 0, "主应用与风险策略脚本已发布");
        report(html.indexOf('rel="canonical" href="https://runner-cpu.github.io/QJZH/"') >= 0, "主页 canonical 地址正确");
        report((html.match(/class="view(?: active)?" data-view=/g) || []).length === 6, "六个 Hash 视图容器均已发布");
        report((html.match(/class="overview-quick"/g) || []).length >= 5, "总览快捷入口覆盖五个业务视图");
        report(html.indexOf('data-i18n="view.algorithm.api"') >= 0 && html.indexOf("compensate()") >= 0, "算法标准接口与适用域说明存在");
        report(dashboard.indexOf("function getNextSample(") >= 0 && dashboard.indexOf("function runImportedReplay(") >= 0, "主看板导入回放链路存在");
        report(dashboard.indexOf("function updateTrendA11ySummary(") >= 0, "趋势图同步提供文字摘要");
      }).catch(function (error) {
        report(false, "公开产物读取失败：" + error.message);
      });
    });
  </script>
</body>
</html>
