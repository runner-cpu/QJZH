<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="qjzh-release-version" content="20261002">
  <meta name="qjzh-model-version" content="1.0.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#081925">
  <title>青境智衡 · 部署自检</title>
  <link rel="canonical" href="https://runner-cpu.github.io/QJZH/online_test.html">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307141f'/%3E%3Cpath d='M16 38h32M22 28h20M32 14v34' stroke='%2316d6b0' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <script defer src="model_weights.js?v=1.0.0"></script>
  <script defer src="compensator_engine.js?v=1.0.0"></script>
  <!-- Release assets use qjzh-release-version; model assets use qjzh-model-version. Keep both pages in sync. -->
  <script defer src="build_info.js?v=20261002"></script>
  <script defer src="ui_text_map.js?v=20261002"></script>
  <script defer src="errorHandler.js?v=20261002"></script>
  <script defer src="csvTemplate.js?v=20261002"></script>
  <script defer src="dataImport.js?v=20261002"></script>
  <script defer src="riskPolicy.js?v=20261002"></script>
  <script defer src="reportRenderer.js?v=20261002"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 20px 64px; color: #e8f0f8; background: radial-gradient(circle at 15% 0%, rgba(0,212,170,.16), transparent 34rem), #081925; }
    main { width: min(900px, 100%); margin: 0 auto; }
    header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 8px; color: #00d4aa; font: 800 .75rem/1.2 ui-monospace, monospace; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.8rem); line-height: 1; letter-spacing: -.04em; }
    .summary { min-width: 150px; padding: 14px 16px; border: 1px solid rgba(148,181,204,.28); border-radius: 10px; background: rgba(16,42,59,.9); text-align: right; }
    .summary strong { display: block; color: #00d4aa; font: 900 1.7rem/1 ui-monospace, monospace; }
    .summary span { display: block; margin-top: 6px; color: #93adbf; font-size: .76rem; }
    .metadata { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; margin-bottom: 18px; overflow: hidden; border: 1px solid rgba(148,181,204,.24); border-radius: 10px; background: rgba(148,181,204,.24); }
    .metadata div { min-width: 0; padding: 13px 15px; background: #10293a; }
    .metadata span { display: block; margin-bottom: 5px; color: #7897ac; font-size: .72rem; }
    .metadata code { color: #dceaf3; overflow-wrap: anywhere; }
    ol { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    li { position: relative; padding: 13px 16px 13px 46px; border: 1px solid rgba(148,181,204,.2); border-radius: 8px; background: rgba(16,41,58,.86); line-height: 1.5; }
    li::before { position: absolute; left: 15px; top: 14px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; font: 900 .7rem/1 ui-monospace, monospace; content: "…"; }
    li.pass { border-color: rgba(0,212,170,.38); }
    li.pass::before { color: #041c17; background: #00d4aa; content: "✓"; }
    li.fail { border-color: rgba(255,77,94,.55); background: rgba(92,27,40,.5); }
    li.fail::before { color: #fff; background: #ff4d5e; content: "!"; }
    footer { margin-top: 22px; color: #7897ac; font-size: .82rem; }
    footer a { color: #8cebd8; }
    @media (max-width: 820px) { .metadata { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { body { padding: 24px 14px 48px; } header { grid-template-columns: 1fr; align-items: start; } .summary { text-align: left; } .metadata { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Deployment diagnostics</p><h1>青境智衡部署自检</h1></div>
      <div class="summary" aria-live="polite"><strong id="summaryCount">0 / 0</strong><span id="summaryLabel">正在检查公开产物</span></div>
    </header>
    <section class="metadata" aria-label="构建信息">
      <div><span>运行环境</span><code id="environment">--</code></div>
      <div><span>提交版本</span><code id="commit">--</code></div>
      <div><span>发布版本</span><code id="version">--</code></div>
      <div><span>模型版本</span><code id="modelVersion">--</code></div>
      <div><span>构建时间</span><code id="builtAt">--</code></div>
    </section>
    <ol id="results"></ol>
    <footer>此页只检查公开静态产物和浏览器运行接口。<a href="./#/overview">返回环境总览</a></footer>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var passedCount = 0;
      var totalCount = 0;
      var summaryCount = document.getElementById("summaryCount");
      var summaryLabel = document.getElementById("summaryLabel");

      function updateSummary() {
        summaryCount.textContent = passedCount + " / " + totalCount;
        summaryLabel.textContent = passedCount === totalCount ? "全部检查通过" : "发现 " + (totalCount - passedCount) + " 项异常";
      }

      function report(passed, message) {
        totalCount += 1;
        if (passed) passedCount += 1;
        var item = document.createElement("li");
        item.className = passed ? "pass" : "fail";
        item.textContent = message;
        document.getElementById("results").appendChild(item);
        updateSummary();
      }

      var build = window.BUILD_INFO || { version: "dev", commit: "local", builtAt: null, environment: "local" };
      document.getElementById("environment").textContent = build.environment || "unknown";
      document.getElementById("commit").textContent = build.commit || build.version || "unknown";
      document.getElementById("version").textContent = build.version || "unknown";
      document.getElementById("modelVersion").textContent = window.MODEL_WEIGHTS?.version || "unknown";
      document.getElementById("builtAt").textContent = build.builtAt || "本地开发构建";
      report(Boolean(build.version && build.commit && build.environment), "构建版本、提交与环境字段已加载");
      report(build.environment !== "production" || Boolean(build.builtAt), "生产构建包含不可变 UTC 构建时间");

      var hasWeights = typeof window.MODEL_WEIGHTS !== "undefined";
      report(hasWeights && Boolean(window.MODEL_WEIGHTS.version), "锁定模型参数与版本已加载");
      try {
        var result = window.compensate(2800, 10, 60, 30);
        report(Number.isFinite(result) && result >= 15 && result <= 25, "高原校准接口可执行：" + result.toFixed(2) + " ppm");
      } catch (error) {
        report(false, "高原校准接口执行失败：" + error.message);
      }
      report(Boolean(window.QJZH && window.QJZH.dataImport), "数据接入模块已加载");
      report(Boolean(window.QJZH && window.QJZH.riskPolicy), "统一风险策略模块已加载");
      report(Boolean(window.QJZH && window.QJZH.reportRenderer), "环境报告渲染器已加载");
      report(typeof window.QJZH?.dataImport?.nextRecord === "function" && typeof window.QJZH?.dataImport?.useImported === "function", "导入数据回放接口可用");

      try {
        var sampleReport = { language: "zh", startDate: "2026-09-01", endDate: "2026-09-27", noRecords: false, complianceRate: 0.5, averageNh3: 12, maxNh3: 20, temperatureRange: { min: -5, max: 10 }, adviceCount: 2, riskDistribution: { "正常": 1, "关注": 1, "待办": 0, "紧急": 0 }, trendSeries: [{ timestamp: "2026-09-27T08:00:00+08:00", value: 12 }], generatedAt: "2026-09-27", source: "QJZH 本地记录" };
        var reportHtml = window.QJZH.reportRenderer.buildHtml(sampleReport);
        var institutionHtml = window.QJZH.reportRenderer.buildHtml(Object.assign({}, sampleReport, { seriesMode: "institution", trendSeries: [{ label: "海东示范圈舍", value: 8.4 }] }));
        report(reportHtml.indexOf("data-chart='nh3-trend'") >= 0, "报告包含氨气趋势图");
        report(institutionHtml.indexOf("data-chart='nh3-comparison'") >= 0, "机构报告包含圈舍对比图");
        report(reportHtml.indexOf("data-chart='risk-distribution'") >= 0, "报告包含风险分布图");
        report(reportHtml.indexOf("print-color-adjust:exact") >= 0, "报告启用打印颜色保真");
      } catch (error) {
        report(false, "报告渲染器执行失败：" + error.message);
      }

      Promise.all([
        fetch("index.html", { cache: "no-store" }).then(function (response) { if (!response.ok) throw new Error("index.html HTTP " + response.status); return response.text(); }),
        fetch("dashboard.js", { cache: "no-store" }).then(function (response) { if (!response.ok) throw new Error("dashboard.js HTTP " + response.status); return response.text(); })
      ]).then(function (sources) {
        var html = sources[0];
        var dashboard = sources[1];
        report((html.match(/<main\b/g) || []).length === 1 && html.indexOf('href="#main-content"') >= 0, "主页面包含唯一 main 与跳转主内容链接");
        report((html.match(/<button class="pipeline-step/g) || []).length === 3 && html.indexOf('id="pipelineNext"') >= 0, "流程步骤与下一步操作均使用原生按钮");
        report(html.indexOf('src="dashboard.js?v=') >= 0 && html.indexOf('src="riskPolicy.js?v=') >= 0, "主应用与风险策略脚本已发布");
        report(html.indexOf('rel="canonical" href="https://runner-cpu.github.io/QJZH/"') >= 0, "主页 canonical 地址正确");
        report((html.match(/class="view(?: active)?" data-view=/g) || []).length === 6, "六个 Hash 视图容器均已发布");
        report((html.match(/class="overview-quick"/g) || []).length >= 5, "总览快捷入口覆盖五个业务视图");
        report(html.indexOf('data-i18n="view.algorithm.api"') >= 0 && html.indexOf("compensate()") >= 0, "算法标准接口与适用域说明存在");
        report(dashboard.indexOf("function getNextSample(") >= 0 && dashboard.indexOf("function runImportedReplay(") >= 0, "主看板导入回放链路存在");
        report(dashboard.indexOf("function updateTrendA11ySummary(") >= 0, "趋势图同步提供文字摘要");
      }).catch(function (error) {
        report(false, "公开产物读取失败：" + error.message);
      });
    });
  </script>
</body>
</html>
