<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青境智衡部署验证</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307141f'/%3E%3Cpath d='M16 38h32M22 28h20M32 14v34' stroke='%2316d6b0' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <script src="model_weights.js?v=1.0.0"></script>
  <script src="compensator_engine.js?v=1.0.0"></script>
  <script src="ui_text_map.js?v=20260923"></script>
  <script src="errorHandler.js?v=20260923"></script>
  <script src="csvTemplate.js?v=20260923"></script>
  <script src="dataImport.js?v=20260923"></script>
  <script src="build_info.js?v=20260924"></script>
  <style>body{max-width:720px;margin:48px auto;padding:0 20px;background:#0b1a2a;color:#e8f0f8;font-family:system-ui}li{margin:10px 0;padding:10px;border-left:4px solid #7a9bb5;background:#10293a}.pass{border-color:#00d4aa}.fail{border-color:#ff4d5e}code{color:#00d4aa}</style>
</head>
<body>
  <h1>青境智衡部署验证</h1>
  <p>部署时间戳：<code id="deployedAt"></code></p>
  <p>模型版本号：<code id="modelVersion">--</code></p>
  <ol id="results"></ol>
  <script>
    /** @param {boolean} passed @param {string} message @returns {void} */
    function report(passed, message) {
      var item = document.createElement("li");
      item.className = passed ? "pass" : "fail";
      item.textContent = (passed ? "PASS" : "FAIL") + ": " + message;
      document.getElementById("results").appendChild(item);
    }
    /** @returns {void} */
    function runOnlineTests() {
      document.getElementById("deployedAt").textContent = window.BUILD_INFO?.deployedAt || new Date().toISOString();
      var hasWeights = typeof MODEL_WEIGHTS !== "undefined";
      report(hasWeights, hasWeights ? "MODEL_WEIGHTS 已定义" : "MODEL_WEIGHTS 未定义，请检查 model_weights.js 加载路径。");
      document.getElementById("modelVersion").textContent = hasWeights ? MODEL_WEIGHTS.version : "未加载";
      try {
        var result = compensate(2800, 10, 60, 30);
        report(result >= 15 && result <= 25, "compensate(2800, 10, 60, 30) = " + result.toFixed(2) + " ppm（期望 15-25 ppm）");
      } catch (error) {
        report(false, "补偿引擎执行失败：" + error.message);
      }
      report(hasWeights && Boolean(MODEL_WEIGHTS.version), "部署时间戳与模型版本已显示：" + (hasWeights ? MODEL_WEIGHTS.version : "未加载"));
    }
    runOnlineTests();
      report(Boolean(window.QJZH && window.QJZH.dataImport), "数据接入模块已加载");
      report(Boolean(window.BUILD_INFO?.version && window.BUILD_INFO?.deployedAt), "运行时版本与部署日期已动态加载");
      report(typeof window.QJZH?.dataImport?.nextRecord === "function" && typeof window.QJZH?.dataImport?.useImported === "function", "导入数据时间回放接口已加载");
    fetch("index.html", { cache: "no-store" }).then(function (response) {
      if (!response.ok) throw new Error("index.html HTTP " + response.status);
      return response.text();
    }).then(function (html) {
      report(html.indexOf("qjzh-boundary-banner") >= 0, "边界声明 Banner 标记（主页面）");
      report(html.indexOf("dataImportPanel") >= 0, "数据接入面板标记（主页面）");
      report(html.indexOf("pipeline-strip") >= 0, "流水线四节点标记（主页面）");
      report(html.indexOf("institutionView") >= 0 && html.indexOf("reportPanel") >= 0, "机构视图与季度报告标记（主页面）");
      report(html.indexOf("动态通风调控执行") < 0, "原'动态通风调控执行'已从源码移除");
      report(html.indexOf("数据接入") >= 0 && html.indexOf("指令待下发") < 0, "流水线已改为'数据接入→高原校准→智能决策→建议输出'");
      report(html.indexOf("confidenceBadge") >= 0, "置信度元素存在");
      report(html.indexOf("getNextSample") >= 0 && html.indexOf("runImportedReplay") >= 0, "主看板导入数据回放链路存在");
      report(html.indexOf("data-i18n=\"qjzh.data.title\"") >= 0 && html.indexOf("data-i18n=\"qjzh.institution.title\"") >= 0, "新增面板三语标记存在");
      report(html.indexOf("qjzh-scene-toggle") >= 0, "移动端场景预设收起开关存在");
      report(html.indexOf('value="bo"') >= 0 && html.indexOf("qjzh-scene-presets") >= 0, "藏语选项与场景预设存在");
      report(html.indexOf("纯软件环境数据服务演示") >= 0, "页脚源码已是合规声明");
    }).catch(function (error) {
      report(false, "主页面标记读取失败：" + error.message);
    });
  </script>
</body>
</html>
